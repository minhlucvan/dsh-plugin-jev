# Bundle patch applied over the selected DSH profile when this package is listed
# in `dsh.profile.bundles`. The row id is deployment-local; the package name
# must match package.json.
#
# `dsh-base` provides `tools`, `commands` and `skills`, so the four rows below
# activate on any ordinary profile. Rows are inserted in order and the tool,
# command and skill companions inject the `jev` service, so the core row must
# stay first.

- insert:
    - id: dsh-plugin-jev
      name: 'dsh-plugin-jev'
      config:
        # Name of the reference the credential is resolved from. Store the key
        # itself in the settings page (or in the host credential file); the
        # secret is never part of this patch.
        apiKeyEnv: TYPESAFE_API_KEY
        model: jev-latest
        confidenceFloor: 0.5
        confirmFloor: 0.85

    # The tool face is the product: these are the tools the agent calls.
    - id: dsh-plugin-jev-tools
      name: 'dsh-plugin-jev/tools'

    # Teaches the agent when a Jev call is cheaper than reasoning it out.
    - id: dsh-plugin-jev-skills
      name: 'dsh-plugin-jev/skills'

    # `/jev` reports the session's token accounting without sending a message.
    - id: dsh-plugin-jev-commands
      name: 'dsh-plugin-jev/commands'

    # Tells the agent, in its system prompt, to delegate a narrow decision rather
    # than reason it out. This is the adoption lever: a tool description says what
    # a tool does, not that it should be preferred.
    - id: dsh-plugin-jev-prompt
      name: 'dsh-plugin-jev/prompt'

    # Opt-in rows, because a pending injection blocks startup and not every
    # profile provides their services:
    #   ./routes     needs `webServer` (present in dsh-web-app, not in headless)
    #   ./invariant  needs `invariants`, which no ordinary profile provides
    #   ./client     is loaded through the `dsh.client` manifest field, not a row
